<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e8392c">
<title>佳文和博文的消防车</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3fb; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hide { display: none !important; }
  body:not(.playing) #dock, body:not(.playing) #pad, body:not(.playing) #tank, body:not(.playing) #goals { display: none; }
  /* top bar */
  #stars { position: fixed; left: 14px; top: 12px; padding: 8px 16px 8px 12px; border-radius: 30px; background: rgba(255,255,255,.9); box-shadow: 0 4px 0 rgba(0,0,0,.12);
           font-size: 28px; font-weight: 800; color: #e0491d; display: flex; align-items: center; gap: 6px; transition: transform .2s; z-index: 5; }
  #stars.bump { transform: scale(1.25); }
  #stars small { font-size: 14px; color: #8a6d3b; font-weight: 700; }
  .topbtn { position: fixed; top: 12px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); font-size: 26px;
            box-shadow: 0 4px 0 rgba(0,0,0,.12); cursor: pointer; z-index: 5; }
  #home { right: 146px; } #mute { right: 80px; } #full { right: 14px; }
  #mute.off::after { content: ''; position: absolute; left: 12px; right: 12px; top: 26px; height: 4px; background: #e33; transform: rotate(-35deg); border-radius: 2px; }
  /* goals */
  #goals { position: fixed; left: 14px; top: 76px; padding: 10px 14px; border-radius: 18px; background: rgba(255,255,255,.9); box-shadow: 0 4px 0 rgba(0,0,0,.12); z-index: 4;
           max-width: min(46vw, 300px); }
  #goals h3 { margin: 0 0 6px; font-size: 16px; color: #e0301e; }
  #goals .g { display: flex; align-items: center; gap: 8px; font-size: clamp(15px, 1.8vw, 19px); font-weight: 800; color: #2b2f3a; padding: 3px 0; transition: opacity .3s; }
  #goals .g .ic { font-size: 22px; width: 28px; text-align: center; }
  #goals .g .ck { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; border: 3px solid #c9ced8; flex: none; }
  #goals .g.done { color: #2a9d55; } #goals .g.done .ck { background: #2fb45a; border-color: #2fb45a; }
  #goals .g.done .ck::after { content: '✓'; color: #fff; font-size: 16px; display: block; text-align: center; line-height: 18px; }
  #goals .g.later { opacity: .35; } #goals .g.now { animation: nowpulse 1.2s infinite; }
  #goals .g .pg { font-size: 14px; color: #8a6d3b; }
  @keyframes nowpulse { 50% { transform: translateX(4px); } }
  #timer { font-size: 14px; color: #6b7280; font-weight: 700; margin-top: 4px; }
  /* the speech bubble and the floating label */
  #toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -140%); max-width: min(56vw, 720px); padding: 12px 26px; border-radius: 26px; z-index: 6;
           background: #fff; color: #2b2f3a; font-size: clamp(17px, 2.4vw, 26px); font-weight: 800; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.12);
           transition: transform .35s cubic-bezier(.2,1.4,.4,1); pointer-events: none; border: 4px solid #ffd23a; }
  #toast.show { transform: translate(-50%, 0); }
  #label { position: fixed; transform: translate(-50%, -100%) scale(0); padding: 8px 18px; border-radius: 20px; background: #ff5a3c; color: #fff; font-size: 28px; font-weight: 900;
           box-shadow: 0 5px 0 rgba(0,0,0,.18); pointer-events: none; transition: transform .25s cubic-bezier(.2,1.6,.4,1); white-space: nowrap; z-index: 4; }
  #label.show { transform: translate(-50%, -100%) scale(1); }
  /* the big buttons */
  #dock { position: fixed; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(6, auto); gap: 7px; z-index: 4; }
  .big { width: clamp(48px, min(7.6vw, 12.5vh), 86px); height: clamp(48px, min(7.6vw, 12.5vh), 86px); border-radius: 50%; border: 0; cursor: pointer; position: relative;
         font-size: clamp(22px, min(3.6vw, 5.8vh), 40px); line-height: 1; padding: 0; color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.22), inset 0 -6px 0 rgba(0,0,0,.12);
         transition: transform .1s; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .big b { font-weight: normal; }
  .big span { font-size: clamp(10px, min(1.25vw, 2vh), 14px); font-weight: 800; margin-top: 3px; text-shadow: 0 1px 0 rgba(0,0,0,.25); white-space: nowrap; }
  .big.press, .big.on { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22), inset 0 -3px 0 rgba(0,0,0,.12); }
  .big.on { outline: 5px solid #fff6a8; }
  .big.pulse { animation: pulse 0.9s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 0 0 0 rgba(255,230,80,.9); } 50% { box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 0 0 16px rgba(255,230,80,0); } }
  .c-red { background: #e8392c; } .c-blue { background: #2f7ae5; } .c-yellow { background: #f5b800; } .c-green { background: #28a957; } .c-teal { background: #13a89e; }
  .c-orange { background: #ff7a1a; } .c-purple { background: #8b5cf6; } .c-sky { background: #1fb5e6; } .c-pink { background: #ef5da8; } .c-grey { background: #6c7a89; } .c-navy { background: #3b4a7a; }
  /* the water tank */
  #tank { position: fixed; right: 12px; bottom: calc(var(--dockH, 170px) + 22px + env(safe-area-inset-bottom)); width: 46px; height: 120px; border-radius: 14px;
          background: rgba(255,255,255,.9); box-shadow: 0 4px 0 rgba(0,0,0,.12); padding: 6px; z-index: 4; }
  #tank .in { position: relative; width: 100%; height: 100%; border-radius: 9px; background: #dfe9f2; overflow: hidden; }
  #tank .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(#5cc2ff, #1f7fe0); transition: height .2s; }
  #tank.foam .fill { background: linear-gradient(#ffffff, #cfd8e0); }
  #tank.low .fill { background: linear-gradient(#ffb3a8, #ef4b3c); animation: lowb 0.8s infinite; }
  @keyframes lowb { 50% { opacity: .55; } }
  #tank .ic { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-size: 20px; }
  /* the driving pad */
  #pad { position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: clamp(140px, min(21vw, 36vh), 240px); height: clamp(140px, min(21vw, 36vh), 240px); z-index: 4; }
  #pad button { position: absolute; width: 36%; height: 36%; border-radius: 22px; border: 0; background: rgba(255,255,255,.92); font-size: clamp(28px, 3.6vw, 42px);
                box-shadow: 0 6px 0 rgba(0,0,0,.18); cursor: pointer; }
  #pad button.on { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.18); background: #fff6a8; }
  #pad [data-pad=up] { left: 32%; top: 0; } #pad [data-pad=down] { left: 32%; bottom: 0; } #pad [data-pad=left] { left: 0; top: 32%; } #pad [data-pad=right] { right: 0; top: 32%; }
  #pad .hub { position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; border-radius: 50%; background: #e8392c; display: flex; align-items: center; justify-content: center;
              font-size: clamp(24px, 3.2vw, 38px); box-shadow: inset 0 -5px 0 rgba(0,0,0,.2); }
  .flystar { position: fixed; font-size: 54px; transform: scale(1.6); transition: left 1s cubic-bezier(.5,0,.3,1), top 1s cubic-bezier(.5,-.5,.3,1), transform 1s; pointer-events: none; z-index: 60; }
  /* overlays: title, menu, intro, result */
  .overlay { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .5s; }
  #title { background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.55), rgba(191,227,251,.25)); }
  #title.fade { opacity: 0; pointer-events: none; }
  #title h1 { margin: 0; font-size: clamp(36px, 7vw, 84px); color: #e0301e; letter-spacing: 4px; text-shadow: 0 5px 0 #fff, 0 10px 0 rgba(0,0,0,.12); font-weight: 900; text-align: center; }
  #title .sub { font-size: clamp(16px, 2.4vw, 26px); color: #2b4a6a; font-weight: 800; text-align: center; }
  #start { width: clamp(150px, 20vw, 220px); height: clamp(150px, 20vw, 220px); border-radius: 50%; border: 0; background: #e8392c; color: #fff; font-size: clamp(34px, 5vw, 56px);
           font-weight: 900; box-shadow: 0 10px 0 #a3170f, 0 0 0 10px rgba(255,255,255,.6); cursor: pointer; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-10px) scale(1.04); } }
  #loading { font-size: 20px; color: #2b4a6a; font-weight: 700; }
  body.loaded #loading { display: none; } body:not(.loaded) #start { opacity: .4; pointer-events: none; }
  #menu { background: rgba(20, 60, 110, .45); }
  #menu h2 { margin: 0; color: #fff; font-size: clamp(26px, 4.2vw, 48px); text-shadow: 0 4px 0 rgba(0,0,0,.25); }
  #cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.6vw, 18px); width: min(92vw, 860px); max-height: 78vh; overflow-y: auto; padding: 6px 6px 12px; touch-action: pan-y; }
  .card { position: relative; border-radius: 22px; background: #fff; padding: clamp(6px, 1.2vw, 14px) 8px; text-align: center; cursor: pointer; box-shadow: 0 7px 0 rgba(0,0,0,.18); border: 0; font-family: inherit; }
  .card:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
  .card .ic { font-size: clamp(30px, min(5vw, 7vh), 58px); line-height: 1.1; }
  .card .no { font-size: clamp(12px, 1.4vw, 15px); color: #8a6d3b; font-weight: 800; }
  .card .nm { font-size: clamp(15px, 2vw, 23px); color: #2b2f3a; font-weight: 900; }
  .card .st { font-size: clamp(15px, 2.1vw, 25px); letter-spacing: 2px; color: #ffbf1a; }
  .card .st .off { color: #d7dbe2; }
  .card.locked { filter: grayscale(1); opacity: .6; }
  .card.locked::after { content: '🔒'; position: absolute; right: 10px; top: 8px; font-size: 26px; }
  .card.free { background: linear-gradient(#fff, #fff4d6); }
  #intro { pointer-events: none; }
  #intro .box { background: #fff; border-radius: 30px; padding: 22px 46px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.18); border: 6px solid #ffd23a; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  #intro .ic { font-size: 74px; } #intro .lv { font-size: 20px; color: #8a6d3b; font-weight: 800; } #intro .nm { font-size: clamp(30px, 5vw, 54px); color: #e0301e; font-weight: 900; }
  #intro .ds { font-size: clamp(16px, 2.3vw, 24px); color: #2b4a6a; font-weight: 800; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  #result { background: rgba(20, 60, 110, .45); }
  #result .box { background: #fff; border-radius: 34px; padding: 26px 40px 30px; text-align: center; box-shadow: 0 12px 0 rgba(0,0,0,.2); animation: pop .5s cubic-bezier(.2,1.6,.4,1); min-width: min(84vw, 420px); }
  #result h2 { margin: 0; font-size: clamp(34px, 5.5vw, 60px); color: #e0301e; }
  #result .rs { font-size: clamp(54px, 9vw, 96px); letter-spacing: 6px; margin: 6px 0; }
  #result .rs span { display: inline-block; color: #d7dbe2; transform: scale(.4); transition: transform .4s cubic-bezier(.2,1.8,.4,1), color .2s; }
  #result .rs span.got { color: #ffbf1a; transform: scale(1); }
  #result .tm { font-size: 18px; color: #6b7280; font-weight: 700; }
  #result .row { display: flex; gap: 14px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .pill { border: 0; border-radius: 40px; padding: 14px 24px; font-size: clamp(18px, 2.4vw, 24px); font-weight: 900; color: #fff; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.2); font-family: inherit; }
  .pill:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  @media (max-width: 760px) { #dock { grid-template-columns: repeat(5, auto); } #cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* phone held upright: the dock spans the bottom, the drive pad and the tank sit above it */
  @media (max-aspect-ratio: 4/5) {
    #dock { grid-template-columns: repeat(6, auto); gap: 6px; }
    .big { width: min(13.6vw, 72px); height: min(13.6vw, 72px); }
    .big span { font-size: clamp(10px, 2.7vw, 13px); }
    #pad { bottom: calc(var(--dockH, 170px) + 22px + env(safe-area-inset-bottom)); width: min(40vw, 200px); height: min(40vw, 200px); }
    #toast { top: 74px; max-width: 86vw; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stars">⭐ <b>0</b> <small>小星星</small></div>
<button class="topbtn hide" id="home" title="选关">🏠</button>
<button class="topbtn" id="mute" title="声音">🔊</button>
<button class="topbtn" id="full" title="全屏">⛶</button>
<div id="goals" class="hide"><h3 id="gtitle"></h3><div id="glist"></div><div id="timer"></div></div>
<div id="toast"></div>
<div id="label"></div>
<div id="tank"><div class="in"><div class="fill"></div><div class="ic">💧</div></div></div>
<div id="pad">
  <button data-pad="up">⬆️</button><button data-pad="down">⬇️</button><button data-pad="left">⬅️</button><button data-pad="right">➡️</button>
  <div class="hub">🚒</div>
</div>
<div id="dock">
  <button class="big c-red" data-act="lights">🚨<span>警灯</span></button>
  <button class="big c-blue" data-act="siren">📢<span>警笛</span></button>
  <button class="big c-yellow" data-act="horn">📯<span>喇叭</span></button>
  <button class="big c-orange" data-act="bell">🔔<span>铃铛</span></button>
  <button class="big c-purple" data-act="doors">🚪<span>车门</span></button>
  <button class="big c-green" data-act="tools">🧰<span>工具箱</span></button>
  <button class="big c-pink" data-act="ladder"><svg viewBox="0 0 40 40" width="1em" height="1em"><g stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M12 37 L20 3 M28 37 L34 9"/><path d="M14 30 L30 30 M15.6 23 L31.4 23 M17.2 16 L32.8 16 M18.8 9 L33.6 9" stroke-width="3"/></g></svg><span>云梯</span></button>
  <button class="big c-grey" data-act="outriggers">🦵<span>支腿</span></button>
  <button class="big c-teal" data-act="agent"><b id="agentIc">💧</b><span id="agentTx">水</span></button>
  <button class="big c-sky" data-act="spray">💦<span>按住喷水</span></button>
  <button class="big c-navy" data-act="view">🎥<span id="viewTx">跟随</span></button>
  <button class="big c-red" data-act="fire">🔥<span>去救火</span></button>
  <button class="big c-navy hide" data-act="night">🌙<span>白天黑夜</span></button>
</div>
<div id="title" class="overlay">
  <h1>佳文和博文的消防车</h1>
  <div class="sub">🚒 开车、喷水、救火、救小动物，一关一关闯过去！</div>
  <button id="start">出发！</button>
  <div id="loading">消防车正在开过来……</div>
</div>
<div id="menu" class="overlay hide"><h2>选一关 🚒</h2><div id="cards"></div></div>
<div id="intro" class="overlay hide"><div class="box"><div class="ic"></div><div class="lv"></div><div class="nm"></div><div class="ds"></div></div></div>
<div id="result" class="overlay hide"><div class="box">
  <h2>过关啦！</h2><div class="rs"><span>★</span><span>★</span><span>★</span></div><div class="tm"></div>
  <div class="row"><button class="pill c-orange" id="again">🔁 再玩一次</button><button class="pill c-green" id="next">▶ 下一关</button><button class="pill c-blue" id="tomenu">🏠 选关</button></div>
</div></div>
<script>/*APP*/</script>
</body>
</html>
